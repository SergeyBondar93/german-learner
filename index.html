,"Das"]},{"id":"b1-obwohl-trotzdem-authored-83","prompt":"Она не умела плавать, но всё же вошла в воду.","answer":"Sie konnte nicht schwimmen, trotzdem ging sie ins Wasser.","options":["Sie","konnte","nicht","schwimmen,","trotzdem","ging","sie","ins","Wasser.","losgegangen","sind,"]},{"id":"b1-obwohl-trotzdem-authored-84","prompt":"Хотя весь день шёл снег, аэропорт работал.","answer":"Obwohl es den ganzen Tag schneite, war der Flughafen in Betrieb.","options":["Obwohl","es","den","ganzen","Tag","schneite,","war","der","Flughafen","in","Betrieb.","einen","erreicht.","nicht"]},{"id":"b1-obwohl-trotzdem-authored-85","prompt":"У него было мало денег, однако он купил подарок.","answer":"Er hatte wenig Geld, trotzdem kaufte er ein Geschenk.","options":["Er","hatte","wenig","Geld,","trotzdem","kaufte","er","ein","Geschenk.","erreicht.","nicht"]}]},{"id":"b2-passiv","level":"B2","title":"Пассивный залог","summary":"Сосредотачиваемся на действии и результате.","explanation":"Vorgangspassiv выдвигает на первый план действие или процесс, а не исполнителя. Формула: форма werden в нужном времени + Partizip II в конце. Объект активного предложения обычно становится подлежащим пассивного и сохраняет Nominativ/согласование: Die Firma repariert die Straße → Die Straße wird repariert.\n\nИсполнителя называют с von + Dativ (von der Firma), причину/средство — иногда с durch + Akkusativ. Если исполнитель неизвестен или неважен, его опускают. Для результата или состояния используют Zustandspassiv: sein + Partizip II (Die Tür ist geschlossen). Не смешивайте его с Vorgangspassiv: wird geschlossen — закрывают сейчас/происходит действие, ist geschlossen — закрыта/состояние.\n\nС модальным глаголом пассив строится как модальный глагол + Partizip II + werden: Der Antrag muss heute eingereicht werden. В Perfekt возникает двойной инфинитив: Der Antrag hat eingereicht werden müssen. В письменном немецком часто встречаются замены пассива: sein + zu + Infinitiv выражает необходимость (Die Aufgabe ist bis Freitag zu erledigen), lassen sich + Infinitiv — возможность (Das Problem lässt sich lösen). В таких конструкциях внимательно определяйте, говорится ли о процессе, состоянии, необходимости или возможности.","grammarTables":[{"caption":"Формы пассива на примере reparieren","headers":["Время / вид","Формула","Пример"],"rows":[["Präsens: процесс","werden + Partizip II","Die Straße wird repariert."],["Präteritum: процесс","wurde / wurden + Partizip II","Die Straße wurde repariert."],["Perfekt: процесс","sein + Partizip II + worden","Die Straße ist repariert worden."],["Plusquamperfekt: процесс","war + Partizip II + worden","Die Straße war repariert worden."],["С модальным глаголом","Modalverb + Partizip II + werden","Der Antrag muss heute eingereicht werden."],["Модальный глагол в Perfekt","haben + двойной инфинитив","Der Antrag hat eingereicht werden müssen."],["Zustandspassiv: результат","sein + Partizip II","Die Straße ist repariert."],["Замена: необходимость","sein + zu + Infinitiv","Die Aufgabe ist bis Freitag zu erledigen."],["Замена: возможность","sich lassen + Infinitiv","Das Problem lässt sich lösen."],["Исполнитель","von + Dativ","Die Straße wird von der Firma repariert."]]}],"examples":["Die Rechnung wird heute bezahlt.","Das Gebäude wurde 1920 gebaut."],"tip":"Если важно «что происходит», а не «кто делает», поставьте werden в нужное время и Partizip II в конец.","reference":{"label":"Passive voice — Lingolia English","url":"https://deutsch.lingolia.com/en/grammar/verbs/passive"},"exercises":[{"id":"b2-passiv-1","prompt":"Улицу ремонтируют до конца месяца.","answer":"Die Straße wird bis Ende des Monats repariert.","options":["des","Straße","repariert.","bis","Die","eines","Monats","werden","Ende","wird"]},{"id":"b2-passiv-2","prompt":"Заказ доставят завтра утром.","answer":"Die Bestellung wird morgen früh geliefert.","options":["Bestellung","morgen","früh","wurde","geliefert.","Die","wurden","wird"]},{"id":"b2-passiv-3","prompt":"Все документы проверяю "zum","gefunden"]},{"id":"b2-konjunktiv2-vergangenheit-authored-83","prompt":"Если бы ты проверил размер, рубашка бы подошла.","answer":"Wenn du die Größe geprüft hättest, hätte das Hemd gepasst.","options":["Wenn","du","die","Größe","geprüft","hättest,","hätte","das","Hemd","gepasst.","von","hätten,","angerufen."]},{"id":"b2-konjunktiv2-vergangenheit-authored-84","prompt":"Он бы встретил нас на станции, если бы получил сообщение.","answer":"Er hätte uns am Bahnhof abgeholt, wenn er die Nachricht bekommen hätte.","options":["Er","hätte","uns","am","Bahnhof","abgeholt,","wenn","er","die","Nachricht","bekommen","hätte.","zum","gefunden","von"]},{"id":"b2-konjunktiv2-vergangenheit-authored-85","prompt":"Я бы не забыл дату, если бы записал её в календарь.","answer":"Ich hätte das Datum notiert, wenn ich an den Kalender gedacht hätte.","options":["Ich","hätte","das","Datum","notiert,","wenn","ich","an","den","Kalender","gedacht","hätte.","einen","gefunden","von"]}]},{"id":"b2-konjunktiv1","level":"B2","title":"Konjunktiv I и косвенная речь","summary":"Передаём чужие слова нейтрально, не выдавая их за факт.","explanation":"Konjunktiv I — нейтральный способ передать чужое утверждение, особенно в новостях, протоколах и официальном стиле. Он показывает источник информации: Er sagt, er sei krank — это слова другого человека, а не обязательно подтверждённый факт. Глагол обычно стоит в конце придаточного с dass или в самостоятельном сообщении без dass.\n\nФорму настоящего времени образуют от основы инфинитива с окончаниями -e, -est, -e, -en, -et, -en. Особенно важно различать er sei/er habe и Indikativ er ist/er hat. Во множественном числе формы часто совпадают с Indikativ; чтобы не получилось двусмысленности, используют Konjunktiv II (sie hätten). Для прошедшего времени: habe/sei + Partizip II; для будущего: werde + Infinitiv. При пересказе сохраняйте лицо и время исходного высказывания.","grammarTables":[{"caption":"Частые формы Konjunktiv I","headers":["Глагол","er / sie / es","wir / sie / Sie","Косвенная речь"],"rows":[["sein","sei","seien","Er sagt, er sei krank."],["haben","habe","haben","Sie sagt, sie habe Zeit."],["werden","werde","werden","Er meint, es werde regnen."],["können","könne","können","Sie sagt, er könne helfen."],["müssen","müsse","müssen","Er sagt, sie müsse gehen."],["Прошедшее","habe / sei + Partizip II","hätten / seien + Partizip II","Er sagt, er habe angerufen."]]}],"examples":["Die Sprecherin erklärt, die Lage sei stabil.","Er berichtet, die Gäste hätten abgesagt."],"tip":"В косвенной речи держите дистанцию: «по его словам, он…». Обратите внимание на формы sei, habe, könne, werde.","reference":{"label":"Reported speech — Lingolia English","url":"https://deutsch.lingolia.com/en/grammar/verbs/subjunctive/reported-speech"},"exercises":[{"id":"b2-konjunktiv1-1","prompt":"Врач говорит, что пациент чувствует себя лучше.","answer":"Der Arzt sagt, der Patient sei auf dem Weg der Besserung.","options":["Weg","Der","sei","habe","sagt,","auf","einem","der","Arzt","seien","Besserung.","Patient","dem","der"]},{"id":"b2-konjunktiv1-2","prompt":"Компания сообщила, что откроет новый офис.","answer":"Die Firma teilte mit, sie werde ein neues Büro eröffnen.","options":["Die","werde","neues","habe","teilte","Büro","haben","eröffnen.","ein","seien","Firma","sie","mit,"]},{"id":"b2-konjunktiv1-3","prompt":"По словам директора, встречу перенесли.","answer":"Der Direktor sagt, das Treffen sei verschoben worden.","options":["verschoben","Der","Treffen","sei","haben","werde","sagt,","worden.","Direktor","das"]},{"id":"b2-konjunktiv1-4","prompt":"Она объяснила, что не может остаться дольше.","answer":"Sie erklärte, sie könne nicht länger bleiben.","options":["sie","haben","nicht","erklärte,","bleiben.","werde","länger","Sie","könne"]},{"id":"b2-konjunktiv1-5","prompt":"Представитель заявил, что все документы готовы.","answer":"Der Sprecher erklärte, alle Unterlagen seien fertig.","options":["fertig.","seien","Der","Sprecher","erklärte,"," besser"]},{"id":"a2-komparativ-superlativ-authored-34","prompt":"Теперь я понимаю правило гораздо лучше.","answer":"Jetzt verstehe ich die Regel viel besser.","options":["Jetzt","verstehe","ich","die","Regel","viel","besser.","Suppe","in"]},{"id":"a2-komparativ-superlativ-authored-35","prompt":"Кофе здесь такой же вкусный, как дома.","answer":"Der Kaffee hier schmeckt genauso gut wie zu Hause.","options":["Der","Kaffee","hier","schmeckt","genauso","gut","wie","zu","Hause.","Suppe","besser."]}]},{"id":"b1-verben-mit-praepositionen","level":"B1","title":"Глаголы с предлогами и da-/wo-","summary":"Учим управление глаголов и заменяем предметы словами darauf, daran и другими.","explanation":"Многие глаголы требуют устойчивого предлога, который нужно учить вместе с глаголом и падежом: warten auf + Akkusativ, sprechen mit + Dativ. Предлог сохраняется и в вопросе, и при замене дополнения.\n\nЕсли речь о вещи или ситуации, используйте da(r) + предлог: darauf, daran, damit. Буква r появляется перед гласной: auf etwas → darauf, an etwas → daran. В вопросе используется wo(r) + предлог: Worauf wartest du? Если речь о человеке, da-/wo- не подходят: Auf wen wartest du? Mit wem sprichst du? Предлоги с sich запоминайте вместе с возвратным местоимением и также согласуйте по лицу.","grammarTables":[{"caption":"Глагол, предлог и замена дополнения","headers":["Глагол и управление","Вопрос о вещи","Замена вещи","Вопрос о человеке"],"rows":[["warten auf + Akk.","Worauf wartest du?","Ich warte darauf.","Auf wen wartest du?"],["denken an + Akk.","Woran denkst du?","Ich denke daran.","An wen denkst du?"],["sprechen über + Akk.","Worüber sprecht ihr?","Wir sprechen darüber.","Über wen sprecht ihr?"],["sich freuen auf + Akk.","Worauf freust du dich?","Ich freue mich darauf.","Auf wen freust du dich?"],["sich interessieren für + Akk.","Wofür interessiert sie sich?","Sie interessiert sich dafür.","Für wen interessiert sie sich?"],["arbeiten mit + Dat.","Womit arbeitest du?","Ich arbeite damit.", щихся событий в прошлом, а также настоящего и будущего. Bevor указывает, что действие главной части происходит раньше события в придаточном; nachdem — что позже. В nachdem-придаточном о прошлом часто используют Plusquamperfekt, чтобы явно показать предшествование. Während обозначает одновременность, bis — конечную границу, sobald — момент сразу после события.","grammarTables":[{"caption":"Выбор союза и временная связь","headers":["Союз","Значение / употребление","Пример"],"rows":[["als","Одно событие или период в прошлом","Als ich ankam, war das Büro schon zu."],["wenn","Повторение в прошлом; настоящее или будущее","Wenn ich Feierabend habe, rufe ich an."],["bevor","Главное действие происходит раньше","Bevor wir losfahren, tanken wir."],["nachdem","Главное действие происходит позже","Nachdem sie gegessen hatte, ging sie los."],["während","Действия происходят одновременно","Während ich koche, deckt er den Tisch."],["bis / sobald","До границы / сразу после события","Warte, bis der Bus kommt."]]}],"examples":["Wenn ich Feierabend habe, rufe ich dich an.","Bevor wir losfahren, tanken wir das Auto."],"tip":"Вспомните: als — один раз в прошлом; wenn — повторение или настоящее/будущее. После придаточной части в начале предложения сразу идёт спрягаемый глагол главной части.","exercises":[{"id":"b1-temporalsaetze-1","prompt":"Когда я приехал, офис уже был закрыт.","answer":"Als ich ankam, war das Büro schon geschlossen.","options":["Büro","ich","geschlossen.","war","Als","wenn","schon","bevor","das","ankam,"]},{"id":"b1-temporalsaetze-2","prompt":"Когда у меня заканчивается работа, я звоню тебе.","answer":"Wenn ich Feierabend habe, rufe ich dich an.","options":["ich","nachdem","bevor","dich","Wenn","rufe","an.","ich","habe,","Feierabend"]},{"id":"b1-temporalsaetze-3","prompt":"Перед тем как мы поедем, заправим машину.","answer":"Bevor wir losfahren, tanken wir das Auto.","options":["wir","Bevor","das","nachdem","tanken","während","Auto.","wir","losfahren,"]},{"id":"b1-tempor hored-84","prompt":"Пока гости ждут снаружи, откройте боковой вход.","answer":"Während die Gäste draußen warten, öffnen Sie den Seiteneingang.","options":["Während","die","Gäste","draußen","warten,","öffnen","Sie","den","Seiteneingang.","einen","Wasser"]},{"id":"b1-temporalsaetze-authored-85","prompt":"Перед тем как лечь спать, он читает несколько страниц.","answer":"Bevor er schlafen geht, liest er ein paar Seiten.","options":["Bevor","er","schlafen","geht,","liest","er","ein","paar","Seiten.","warten,","können"]}]},{"id":"b1-satzstellung","level":"B1","title":"Порядок слов и рамочная конструкция","summary":"Собираем главные и придаточные предложения в правильном порядке.","explanation":"В обычном главном предложении спрягаемый глагол стоит на втором месте (V2), но на первом месте может быть не подлежащее, а время или место: Heute fährt der Bus später. В вопросе без вопросительного слова глагол стоит первым.\n\nВ придаточной части с weil, dass, obwohl, wenn или ob спрягаемый глагол уходит в конец: …, weil der Bus später fährt. Если такая часть стоит первой, в главной части сразу после запятой ставится глагол: Wenn der Bus später fährt, nehmen wir ein Taxi.\n\nВ составном глагольном сказуемом части образуют рамку: изменяемая форма стоит на втором месте, а инфинитив, Partizip II или отделяемая приставка — в конце. Nicht обычно отрицает ту часть, перед которой стоит; при отрицании всего действия часто располагается ближе к концу, перед инфинитивом или причастием.","grammarTables":[{"caption":"Опорные схемы порядка слов","headers":["Тип предложения","Схема","Пример"],"rows":[["Главное, V2","Первый элемент + глагол + подлежащее","Heute fährt der Bus früher ab."],["Общий вопрос","Глагол + подлежащее + …","Fährt der Bus heute früher ab?"],["Придаточное","Союз + подлежащее + … + глагол","…, weil der Bus früher abfährt."],["Придаточное в начале","Придаточное, глагол + подлежащее","Wenn es regnet, bleiben wir zu Hause."],["Глагольная рамка","Спрягаемая часть … инфинитив / Partizip","Sie hat den Termin gestern abgesagt."],["Отделяемый глагол","Глагол … приставка","Er ruft seine Schwester heute an."]]}],"examples":["Heute muss ich länger im Büro bleiben.","Wir gehen, obwohl es draußen stark regnet."],"tip":"Сначала найди спрягаемый глагол: в главном он обычно второй, в придаточном — последний.","exercises":[{"id":"b1-satzstellung-1","prompt":"Я остался дома, потому что плохо себя чувствовал.","answer":"Ich blieb zu Hause, weil ich mich schlecht fühlte.","options":["mich","blieb","fühlte.","dass","weil","Ich","obwohl","schlecht","Hause,","ich","zu"]},{"id":"b1-satzstellung-2","prompt":"Если завтра будет солнечно, мы поедем на озеро.","answer":"Wenn morgen die Sonne scheint, fahren wir an den See.","options":["Wenn","fahren","an","obwohl","die","den","dass","See.","wir","einen","morgen","scheint,","Sonne"]},{"id":"b1-satzstellung-3","prompt":"Она говорит, что сегодня работает из дома.","answer":"Sie sagt, dass sie heute von zu Hause arbeitet.","options":["wenn","Sie","Hause","von","zu","sagt,","heute","deshalb","arbeitet.","dass","sie"]},{"id":"b1-satzstellung-4","prompt":"После того как я закончу работу, я позвоню.","answer":"Nachdem ich die Arbeit beendet habe, rufe ich dich an.","options":["trotzdem","ich","rufe","wenn","deshalb","ich","Arbeit","die","an.","habe,","dich","Nachdem","beendet"]},{"id":"b1-satzstellung-5","prompt":"Поезд опоздал, поэтому мы взяли такси.","answer":"Der Zug hatte Verspätung, deshalb nahmen wir ein Taxi.","options":["Zug","ein","nahmen","trotzdem","Der","hatte","Verspätung,","wir","heute","Taxi.","deshalb"]},{"id":"b1-satzstellung-6","prompt":"Я сегодня вечером не могу прийти.","answer":"Ich kann heute Abend nicht kommen.","options":["nicht","heute","morgen","trotzdem","Ich","kann","kommen.","Abend"]},{"id":"b1-satzstellung-7","prompt":"Он не купил билет, потому что забыл кошелёк.","answer":"Er hat kein Ticket gekauft, weil er seine Geldbörse vergessen hat.","options":["später","weil","Geldbörse","morgen","hat     for (const spokenWord of transcript.trim().split(/\s+/).filter(Boolean)) {
        const normalizedSpoken = normalize(spokenWord);
        const exactIndex = options.findIndex((option, index) => !usedOptions.has(index) && normalize(option) === normalizedSpoken);
        if (exactIndex !== -1) {
            usedOptions.add(exactIndex);
            selected.push(exactIndex);
            exactCount += 1;
            if (answerOptions.has(exactIndex))
                answerCount += 1;
            continue;
        }
        const candidates = [...answerOptions]
            .filter((index) => index >= 0 && !usedOptions.has(index))
            .map((index) => ({
            index,
            distance: maxFuzzyDistance(normalizedSpoken, normalize(options[index])),
        }))
            .filter((candidate) => Number.isFinite(candidate.distance))
            .sort((left, right) => left.distance - right.distance);
        if (candidates.length && (candidates.length === 1 || candidates[0].distance < candidates[1].distance)) {
            const match = candidates[0];
            usedOptions.add(match.index);
            selected.push(match.index);
            approximate.push({ spoken: spokenWord, matched: options[match.index] });
            answerCount += 1;
        }
        else {
            unrecognized.push(spokenWord);
        }
    }
    return { selected, approximate, unrecognized, exactCount, answerCount };
};
const matchSpeechAlternatives = function matchSpeechAlternatives(transcripts, options, answer) {
    const matches = transcripts
        .map((transcript) => ({
        transcript,
        ...matchSpokenWords(transcript, options, answer),
        wordCount: transcript.trim().split(/\s+/).filter(Boolean).length,
    }))
        .sort((left, right) => right.answerCount / Math.max(right.wordCount, 1) - left.answerCount / Math.max(left.wordCount, 1)
        || right.answerCount - left.answerCount
        || right.selected.length / Math.max(right.wordCount, 1) - left.selected.length / Math.max(left.wordCount, 1)
        || right.selected.length - left.selected.length
        || right.exactCount - left.exactCount
        || left.approximate.length - right.approximate.length);
    const bestMatch = matches[0];
    return bestMatch
        ? {
            transcript: bestMatch.transcript,
            selected: bestMatch.selected,
            approximate: bestMatch.approximate,
            unrecognized: bestMatch.unrecognized,
            exactCount: bestMatch.exactCount,
            answerCount: bestMatch.answerCount,
        }

};
    const speechErrorMessage = (error) => {
      const messages = {

        'service-not-allowed': 'Браузер запретил службу распознавания речи.',
        'no-speech': 'Речь не распознана. Попробуй говорить громче и ближе к микрофону.',
        'audio-capture': 'Не удалось получить звук с микрофона.',
        network: 'Для распознавания речи этому браузеру может понадобиться интернет.',
        aborted: 'Распознавание остановлено.',

    };
    const stopSpeechRecognition = () => {
      if (!activeRecognition) return;
      state.speechListening = false;
      activeRecognition.stop();
    };

      const route = currentRoute();
      if (!canSynthesizeSpeech || !state.hasAttempted || !route) return;
      const utterance = new window.SpeechSynthesisUtterance(route.topic.exercises[route.index].answer);
      utterance.lang = 'de-DE';
      const germanVoice = window.speechSynthesis.getVoices()
        .find((voice) => voice.lang.toLocaleLowerCase().startsWith('de'));

      window.speechSynthesis.speak(utterance);
    };
    const startSpeechRecognition = () => {
      if (!SpeechRecognition) return;

      if (!route) return;
      const exerciseId = route.topic.exercises[route.index].id;
      state.selected = [];
      state.feedback = null;
      state.speechStatus = 'Слушаю… Говори по-немецки.';
      state.speechListening = true;

        const exercise = current.topic.exercises[current.index];

        state.selected = match.selected;
        state.speechListening = false;
        const approximateStatus = match.approximate.length

    const shuffleWordOptions = (options, answer) => {

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      const answerWords = tokenize(answer).map(normalizeWord);
      if (answerWords.every((word, index) => normalizeWord(shuffled[index]) === word)) {
        [shuffled[0], shuffled[answerWords.length]] = [shuffled[answerWords.length], shuffled[0]];
      }
      return shuffled;
    };
    const pickExerciseSet = (topicId, exercises) => {
      const availableExercises = progressStore.getExercisesForNextRound(topicId, exercises);
      const shuffled = [...availableExercises];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled.slice(0, 15).map((exercise) => ({
        ...exercise,
        options: shuffleWordOptions(exercise.options, exercise.answer),
      }));
    };
    const goHome = () => { location.hash = '#/'; };
    const goToExercise = (topicId, index) => {
      location.hash = '#/topic/' + encodeURIComponent(topicId) + '/' + index;
    };
    const currentRoute = () => {
      const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
      if (parts[0] !== 'topic' || !parts[1]) return null;
      const topicPool = TOPICS.find((item) => item.id === parts[1]);
      if (!topicPool) return null;
      const exercises = state.exerciseSets[topicPool.id]
        || (state.exerciseSets[topicPool.id] = pickExerciseSet(topicPool.id, topicPool.exercises));
      const topic = { ...topicPool, exercises };
      const index = Number.parseInt(parts[2] || '0', 10);
      return { topic, index: Number.isFinite(index) ? Math.max(0, Math.min(index, topic.exercises.length - 1)) : 0 };
    };
    const renderHeader = () => '<header class="header"><p class="brand">Wort für Wort</p><p class="caption">Немецкий — по шагам</p></header>';
    function renderHome() {
      const topics = TOPICS.filter((topic) => topic.level === state.level);
      const pronounsSelected = state.level === 'Местоимения';
      const sectionTitle = pronounsSelected ? 'Местоимения' : 'Уровень ' + state.level;
      const sectionSummary = pronounsSelected
        ? '500 упражнений · до 15 за раунд · 150 для ед. числа и 350 для мн. числа'
        : topics.length + ' тем · ' + (state.level === 'A2' ? '50' : '100') + ' упражнений в теме · до 15 за раунд';
      app.innerHTML = renderHeader()
        + '<section class="intro"><p class="eyebrow">ТВОЯ ПРАКТИКА</p><h1>Выбери тему</h1><p class="body-copy">Разбирай грамматику на русском и сразу закрепляй её в предложениях из жизни.</p></section>'
        + '<nav class="level-tabs" aria-label="Уровень немецкого">'
        + LEVELS.map((level) => '<button class="tab" type="button" data-action="level" data-level="' + level + '" aria-pressed="' + (state.level === level) + '">' + level + '</button>').join('')
        + '</nav><section aria-label="Темы: ' + escapeHtml(sectionTitle) + '"><div class="level-heading"><h2>' + escapeHtml(sectionTitle) + '</h2><span>' + escapeHtml(sectionSummary) + '</span></div>'

        + '<button class="clear-progress" type="button" data-action="clear-progress">Очистить прогресс</button>';
    }
    function renderLesson(topic, index) {
      const exercise = topic.exercises[index];
      const examples = topic.examples.map((example) => '<p class="example">' + escapeHtml(example) + '</p>').join('');

        '<div class="grammar-table-scroll" role="region" aria-label="' + escapeHtml(table.caption) + '" tabindex="0"><table class="grammar-table"><caption>' + escapeHtml(table.caption) + '</caption><thead><tr>'

      ).join('');

        ? '<a class="reference" href="' + escapeHtml(topic.reference.url) + '" target="_blank" rel="noopener noreferrer">Полезно на английском: ' + escapeHtml(topic.reference.label) + '</a>'
        : '';

        const word = exercise.options[optionIndex];
        return '<button class="answer-word" type="button" data-action="remove" data-index="' + optionIndex + '" aria-label="Убрать слово ' + escapeHtml(word) + '"' + (state.feedback ? ' disabled' : '') + '>' + escapeHtml(word) + '</button>';
      }).join(' ');

        ? '<div class="words">' + selectedWords + '</div>'
        : '<span class="placeholder">Нажимай на слова ниже, чтобы собрать ответ</span>';

        const selected = state.selected.includes(optionIndex);

      }).join('');

      }
      const actionLabel = state.feedback
        ? index < topic.exercises.length - 1 ? 'Дальше' : 'К темам'
        : 'Проверить ответ';
      const action = '<aside class="exercise-action-bar" aria-label="Управление упражнением">' + speechControls + '<button class="button primary" type="button" data-action="primary">' + actionLabel + '</button></aside>';
      app.innerHTML = renderHeader()
        + '<button class="back" type="button" data-action="home">‹  Все темы</button>'
        + '<section class="lesson-heading"><p class="eyebrow">' + escapeHtml(topic.level) + ' · ГРАММАТИКА</p><h1>' + escapeHtml(topic.title) + '</h1><p class="body-copy">' + escapeHtml(topic.explanation) + '</p></section>'
        + '<section class="info-card"><p class="label">ПРИМЕРЫ</p>' + examples + grammarTables

        + '<div class="answer-area" aria-label="Твой ответ">' + answer + '</div><div class="words">' + options + '</div>' + feedback + '</section>'
        + '<nav class="navigation" aria-label="Упражнения"><button class="button" type="button" data-action="previous"' + (index === 0 ? ' disabled' : '') + '>Назад</button>'

    }
    function render() {

          goHome();
          break;

          const words = state.selected.map((index) => exercise.options[index]);

          render();
          break;
        }
        case 'previous':
          if (!route) break;
          stopSpeechRecognition();
          goToExercise(route.topic.id, route.index - 1);
          break;

    window.addEventListener('hashchange', render);
    render();
  </script>
